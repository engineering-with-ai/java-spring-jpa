stages:
  - check
  - publish
  - mirror

# The engineering-with-ai runner is a Debian shell executor — no `image:` / `services:` (ignored).
# It provides git+ssh, docker, node, python. Java 21 comes from openjdk-21-jdk, installed by
# tooling-playbooks/gitlab-runner-setup.yml. The Maven wrapper pulls Maven itself.

check:
  stage: check
  before_script:
    - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
    - |
      test -x "$JAVA_HOME/bin/javac" || { echo "openjdk-21-jdk missing on runner — run tooling-playbooks gitlab-runner-setup"; exit 1; }
    - |
      # Falls back to a per-job pipx install when the runner doesn't have semgrep baked in yet —
      # keeps this pipeline self-sufficient rather than blocking on tooling-playbooks
      # gitlab-runner-setup (devops-engineer's repo, not this one). Still worth baking into the
      # runner image eventually to drop this ~10s/job tax.
      export PATH="$HOME/.local/bin:$PATH"
      # pipx's own venv has no pip on this runner (python3-venv's ensurepip support is missing —
      # a tooling-playbooks gap), but the system pip works fine, so install straight with that
      # instead of going through pipx/venv. --break-system-packages: Debian's PEP 668 guard on a
      # non-venv install; harmless no-op if the runner doesn't enforce it.
      command -v semgrep >/dev/null || pip3 install --user --break-system-packages semgrep
      command -v semgrep >/dev/null || { echo "semgrep install failed — check pip/python on the runner"; exit 1; }
    - |
      cat > .ci-toolchains.xml <<EOF
      <toolchains><toolchain><type>jdk</type><provides><version>21</version></provides><configuration><jdkHome>$JAVA_HOME</jdkHome></configuration></toolchain></toolchains>
      EOF
  script:
    # checks      = depcheck + format + lint(PMD) + typecheck + audit-src(SpotBugs+Semgrep)
    #               (audit-packages/OWASP excluded here — advisory-only, needs NVD_API_KEY, not
    #               configured as a CI secret; run `make audit-packages` locally)
    # cover       = unit tests w/ JaCoCo agent + report + 70% line gate
    # integration = failsafe *IT (Testcontainers Postgres + WireMock)
    - make checks MVNW="./mvnw -B --no-transfer-progress -t .ci-toolchains.xml"
    - make cover MVNW="./mvnw -B --no-transfer-progress -t .ci-toolchains.xml"
    - make integration MVNW="./mvnw -B --no-transfer-progress -t .ci-toolchains.xml"
    - |
      awk -F, 'NR>1 {m+=$4; c+=$5} END {printf "Total coverage: %.1f%%\n", 100*c/(c+m)}' target/site/jacoco/jacoco.csv
  coverage: '/Total coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    paths:
      - target/site/jacoco/

publish:
  stage: publish
  script:
    - docker login -u admin -p $HARBOR_PASSWORD 173.211.12.43:8083
    - docker build -t 173.211.12.43:8083/library/java-spring-jpa .
    - docker push 173.211.12.43:8083/library/java-spring-jpa

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:engineering-with-ai/java-spring-jpa.git
  only:
    - main
